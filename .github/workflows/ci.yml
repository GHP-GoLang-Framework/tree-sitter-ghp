name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Generate & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate parser
        run: npm run generate

      - name: Fail if generated files are out of date
        run: |
          if ! git diff --quiet -- src/; then
            echo "::error::src/ is out of date with grammar.js — run 'npm run generate' and commit the result."
            git diff -- src/
            exit 1
          fi

      - name: Run tests
        run: npm test
